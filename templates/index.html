<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訂位雷達｜難訂餐廳空位通知</title>
  <meta name="description" content="自動掃描 EZTABLE 熱門餐廳，有空位時用 Email 和 Telegram 通知你。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="site">
  <div class="site-inner">
    <a class="wordmark" href="/">訂位雷達</a>
    <nav class="site-nav" aria-label="頁面">
      <a href="/inline">韓國餐廳</a>
      <a href="/manage">管理訂閱</a>
    </nav>
  </div>
</header>

<main>
  <section class="lede" aria-labelledby="h1">
    <h1 id="h1">難訂的餐廳一開放訂位，你第一個知道。</h1>
    <p>每 30 分鐘掃描一次 EZTABLE，看到空位就寄 Email 和 Telegram 給你。</p>
    <p class="now" id="now" aria-live="polite">正在讀取空位狀態</p>
  </section>

  <div class="toolbar">
    <div class="tabs" id="region-tabs" role="tablist" aria-label="地區"></div>
    <div class="search">
      <input id="search-input" type="search" placeholder="搜尋餐廳" aria-label="搜尋餐廳" oninput="filterCards()">
    </div>
    <button class="ghost-btn" id="collapse-btn" aria-expanded="true" aria-controls="list-wrap" onclick="toggleList()">收起清單</button>
  </div>

  <div class="collapsible" id="list-wrap">
    <div id="cards" class="list" aria-busy="true">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
    <p id="last-updated" class="list-foot"></p>
  </div>

  <section class="panel" aria-labelledby="sub-h">
    <h2 id="sub-h">訂閱空位通知</h2>
    <p>免費。有位時立即通知，隨時可以取消。</p>

    <div class="grid-2">
      <div class="field">
        <label for="restaurant-select">餐廳</label>
        <select id="restaurant-select" class="input">
          <option value="">載入中</option>
        </select>
      </div>
      <div class="field">
        <label for="people-select">用餐人數</label>
        <select id="people-select" class="input">
          <option value="2">2 人</option>
          <option value="3">3 人</option>
          <option value="4" selected>4 人</option>
          <option value="5">5 人</option>
          <option value="6">6 人</option>
          <option value="8">8 人</option>
        </select>
      </div>
      <div class="field">
        <label for="email-input">Email</label>
        <input id="email-input" type="email" class="input" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="telegram-input">Telegram Chat ID<span class="opt">選填</span></label>
        <input id="telegram-input" type="text" class="input" placeholder="例如 7110379672" inputmode="numeric">
        <span class="hint">傳任何訊息給 <a href="https://t.me/userinfobot" target="_blank" rel="noopener">@userinfobot</a> 就會回你 ID</span>
      </div>
    </div>

    <div style="margin-top:16px">
      <button class="link-btn" id="lookup-toggle" aria-expanded="false" aria-controls="lookup-box" onclick="toggleLookup()">找不到你的餐廳？貼上 EZTABLE 網址新增</button>
    </div>
    <div class="sub-panel" id="lookup-box" hidden>
      <div class="field">
        <label for="lookup-url">EZTABLE 餐廳網址</label>
        <div class="inline-row">
          <input id="lookup-url" type="url" class="input"
            placeholder="https://tw.eztable.com/restaurant/17778"
            onkeydown="if(event.key==='Enter') lookupRestaurant()">
          <button class="btn btn-secondary" id="lookup-btn" onclick="lookupRestaurant()">查詢</button>
        </div>
      </div>
      <div id="lookup-result" class="msg" hidden role="status"></div>

      <div class="field" id="invite-section" hidden style="margin-top:12px">
        <label for="invite-input">邀請碼</label>
        <input id="invite-input" type="text" class="input" placeholder="新增名單外的餐廳需要邀請碼" autocomplete="off">
      </div>
    </div>

    <div style="margin-top:20px">
      <button class="btn btn-primary" id="submit-btn" onclick="subscribe()">有位就通知我</button>
    </div>
    <div class="msg" id="form-msg" hidden role="status"></div>
  </section>
</main>

<footer class="site">
  訂位雷達，資料來自 EZTABLE，每 30 分鐘掃描一次。
</footer>

<script>
  let allCards = []
  let regionMap = {}   // name -> region
  let activeRegion = '全部'

  function formatTime(iso) {
    if (!iso) return ''
    const d = new Date(iso)
    const pad = n => String(n).padStart(2, '0')
    return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
  }

  function buildCard(r, litIndex) {
    const has = r.has_availability
    const region = regionMap[r.name] || ''
    const detail = has
      ? `最近可訂 ${r.next_date}，共 ${r.total_dates} 天有位`
      : '目前沒有空位'
    const checked = r.last_checked ? `掃描於 ${formatTime(r.last_checked)}` : '尚未掃描'

    return `
      <div class="row ${has ? 'lit' : ''}" data-name="${esc(r.name)}" data-region="${esc(region)}" style="--i:${litIndex}">
        <div class="row-main">
          <div class="row-name">${esc(r.name)}${region ? `<small>${esc(region)}</small>` : ''}</div>
          <div class="row-detail">${detail}</div>
        </div>
        <div class="row-side">
          <span class="pill ${has ? 'lit' : ''}">${has ? '有位' : '無空位'}</span>
          <a href="${esc(r.url)}" target="_blank" rel="noopener">前往訂位</a>
          <span class="row-checked">${checked}</span>
        </div>
      </div>`
  }

  function filterCards() {
    const q = document.getElementById('search-input').value.trim().toLowerCase()
    const container = document.getElementById('cards')
    const cards = container.querySelectorAll('.row')
    let shown = 0
    cards.forEach(c => {
      const nameMatch = c.dataset.name.toLowerCase().includes(q)
      const regionMatch = activeRegion === '全部' || c.dataset.region === activeRegion
      const visible = nameMatch && regionMatch
      c.style.display = visible ? '' : 'none'
      if (visible) shown++
    })
    const empty = document.getElementById('empty-search')
    if (empty) empty.remove()
    if (shown === 0) {
      container.insertAdjacentHTML('beforeend',
        `<div id="empty-search" class="empty">沒有符合「${esc(q || activeRegion)}」的餐廳。換個關鍵字，或在下方新增餐廳。</div>`)
    }
  }

  function setRegion(region) {
    activeRegion = region
    document.querySelectorAll('.tab').forEach(t => {
      t.setAttribute('aria-selected', t.dataset.region === region ? 'true' : 'false')
    })
    filterCards()
  }

  async function loadStatus() {
    const container = document.getElementById('cards')
    try {
      const res = await fetch('/api/status')
      const data = await res.json()
      allCards = data

      const avail = data.filter(r => r.has_availability).length
      const times = data.filter(r => r.last_checked).map(r => r.last_checked).sort().reverse()
      const when = times.length ? `<span class="when">上次掃描 ${formatTime(times[0])}</span>` : ''
      document.getElementById('now').innerHTML = avail
        ? `現在有 <strong>${avail} 家</strong>可以訂。${when}`
        : `監控中的 ${data.length} 家目前都沒有空位。${when}`

      // 有位的排前面
      const sorted = [...data].sort((a, b) => b.has_availability - a.has_availability)
      let lit = 0
      container.innerHTML = sorted.length
        ? sorted.map(r => buildCard(r, r.has_availability ? lit++ : 0)).join('')
        : '<div class="empty">還沒有掃描資料。第一次掃描完成後會出現在這裡。</div>'
      container.setAttribute('aria-busy', 'false')

      if (times.length)
        document.getElementById('last-updated').textContent = `資料更新於 ${formatTime(times[0])}`
      filterCards()
    } catch {
      container.innerHTML = '<div class="empty">讀不到空位狀態。重新整理頁面再試一次。</div>'
      container.setAttribute('aria-busy', 'false')
      document.getElementById('now').textContent = '讀不到空位狀態'
    }
  }

  async function loadRestaurants() {
    const res = await fetch('/api/restaurants')
    const list = await res.json()

    regionMap = {}
    const regions = new Set()
    list.forEach(r => {
      regionMap[r.name] = r.region || ''
      if (r.region) regions.add(r.region)
    })

    const regionOrder = ['台北', '新北', '桃園', '新竹', '台中']
    const sorted = regionOrder.filter(r => regions.has(r))
      .concat([...regions].filter(r => !regionOrder.includes(r)))
    const tabsEl = document.getElementById('region-tabs')
    tabsEl.innerHTML = ['全部', ...sorted].map(r =>
      `<button class="tab" role="tab" aria-selected="${r === '全部'}" data-region="${esc(r)}" onclick="setRegion('${esc(r)}')">${esc(r)}</button>`
    ).join('')

    const select = document.getElementById('restaurant-select')
    select.innerHTML = list.map(r =>
      `<option value="${r.id}" data-name="${esc(r.name)}" data-url="${esc(r.url)}" data-people="${r.people}">${esc(r.name)}</option>`
    ).join('')
  }

  // 自訂餐廳查詢
  let customRestaurant = null

  function toggleLookup() {
    const box = document.getElementById('lookup-box')
    const btn = document.getElementById('lookup-toggle')
    box.hidden = !box.hidden
    btn.setAttribute('aria-expanded', String(!box.hidden))
    if (!box.hidden) document.getElementById('lookup-url').focus()
  }

  function showLookup(text, type) {
    const el = document.getElementById('lookup-result')
    el.textContent = text
    el.className = `msg ${type}`
    el.hidden = false
  }

  async function lookupRestaurant() {
    const url = document.getElementById('lookup-url').value.trim()
    const btn = document.getElementById('lookup-btn')
    if (!url) return

    btn.disabled = true; btn.textContent = '查詢中'
    document.getElementById('lookup-result').hidden = true
    customRestaurant = null
    document.getElementById('invite-section').hidden = true

    try {
      const res = await fetch(`/api/lookup-restaurant?url=${encodeURIComponent(url)}`)
      const data = await res.json()
      if (res.ok) {
        customRestaurant = data
        showLookup(`找到了：${data.restaurant_name}。已幫你選好，輸入邀請碼後就能訂閱。`, 'ok')
        document.getElementById('invite-section').hidden = false
        const select = document.getElementById('restaurant-select')
        const existing = [...select.options].find(o => o.value == data.restaurant_id)
        if (!existing) {
          const opt = new Option(data.restaurant_name, data.restaurant_id)
          opt.dataset.name = data.restaurant_name
          opt.dataset.url = data.restaurant_url
          opt.dataset.people = '4'
          opt.dataset.custom = '1'
          select.add(opt)
        }
        select.value = data.restaurant_id
      } else {
        showLookup(data.detail || '查不到這家餐廳。確認網址是 tw.eztable.com/restaurant/數字 的格式。', 'err')
      }
    } catch {
      showLookup('連線失敗，請再試一次。', 'err')
    }
    btn.disabled = false; btn.textContent = '查詢'
  }

  async function subscribe() {
    const select = document.getElementById('restaurant-select')
    const opt = select.selectedOptions[0]
    const email = document.getElementById('email-input').value.trim()
    const people = parseInt(document.getElementById('people-select').value)
    const telegram = document.getElementById('telegram-input').value.trim()
    const inviteCode = document.getElementById('invite-input')?.value.trim()
    const isCustom = opt?.dataset.custom === '1'

    if (!email.includes('@')) return showMsg('Email 格式不對，請檢查後再送出。', 'err')
    if (!opt?.value) return showMsg('請先選一家餐廳。', 'err')
    if (isCustom && !inviteCode) return showMsg('新增名單外的餐廳需要邀請碼。', 'err')

    const btn = document.getElementById('submit-btn')
    btn.disabled = true; btn.textContent = '送出中'

    try {
      const res = await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email, people,
          restaurant_name: opt.dataset.name,
          restaurant_id: parseInt(opt.value),
          restaurant_url: opt.dataset.url,
          telegram_chat_id: telegram || null,
          invite_code: inviteCode || null,
        })
      })
      const data = await res.json()
      if (res.ok) {
        showMsg(`已訂閱 ${opt.dataset.name}。確認信已寄到 ${email}，有位時會再通知你。`, 'ok')
        document.getElementById('email-input').value = ''
        document.getElementById('telegram-input').value = ''
        if (inviteCode) document.getElementById('invite-input').value = ''
        document.getElementById('lookup-box').hidden = true
        document.getElementById('lookup-toggle').setAttribute('aria-expanded', 'false')
        customRestaurant = null
      } else {
        showMsg(data.detail || '訂閱沒有成功，請再試一次。', 'err')
      }
    } catch { showMsg('連線失敗，請再試一次。', 'err') }

    btn.disabled = false; btn.textContent = '有位就通知我'
  }

  function showMsg(text, type) {
    const el = document.getElementById('form-msg')
    el.textContent = text
    el.className = `msg ${type}`
    el.hidden = false
  }

  function toggleList() {
    const wrap = document.getElementById('list-wrap')
    const btn = document.getElementById('collapse-btn')
    wrap.hidden = !wrap.hidden
    btn.setAttribute('aria-expanded', String(!wrap.hidden))
    btn.textContent = wrap.hidden ? '展開清單' : '收起清單'
  }

  // 先載入地區資料，再渲染列表（確保 regionMap 已填好）
  loadRestaurants().then(() => {
    loadStatus()
    setInterval(loadStatus, 5 * 60 * 1000)
  })
</script>
</body>
</html>
