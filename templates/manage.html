<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理訂閱｜訂位雷達</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="site">
  <div class="site-inner">
    <a class="wordmark" href="/">訂位雷達</a>
    <nav class="site-nav" aria-label="頁面">
      <a href="/">台灣餐廳</a>
      <a href="/inline">韓國餐廳</a>
    </nav>
  </div>
</header>

<main>
  <section class="lede" aria-labelledby="h1">
    <h1 id="h1">管理訂閱</h1>
    <p>輸入訂閱時用的 Email，就能看到並取消你的通知。</p>
  </section>

  <section class="panel" style="margin-top:28px" aria-label="查詢訂閱">
    <div class="field">
      <label for="email-input">Email</label>
      <div class="inline-row">
        <input id="email-input" type="email" class="input"
          placeholder="you@example.com" autocomplete="email"
          onkeydown="if(event.key==='Enter') loadSubs()">
        <button class="btn btn-secondary" onclick="loadSubs()">查詢</button>
      </div>
    </div>
    <div class="msg" id="form-msg" hidden role="status"></div>
  </section>

  <div id="result" aria-live="polite" style="margin-top:28px"></div>
</main>

<footer class="site">訂位雷達。確認信裡也有每家餐廳的取消連結。</footer>

<script>
  function formatDate(iso) {
    if (!iso) return ''
    const d = new Date(iso)
    return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
  }

  function showMsg(text, type) {
    const el = document.getElementById('form-msg')
    el.textContent = text
    el.className = `msg ${type}`
    el.hidden = false
  }

  async function loadSubs() {
    const email = document.getElementById('email-input').value.trim()
    if (!email.includes('@')) { showMsg('Email 格式不對，請檢查後再查詢。', 'err'); return }
    document.getElementById('form-msg').hidden = true

    const result = document.getElementById('result')
    result.innerHTML = '<div class="list"><div class="skeleton"></div><div class="skeleton"></div></div>'

    try {
      const res = await fetch(`/api/my-subscriptions?email=${encodeURIComponent(email)}`)
      const subs = await res.json()

      if (!Array.isArray(subs) || subs.length === 0) {
        result.innerHTML = `
          <div class="state">
            <strong>${esc(email)}</strong> 目前沒有訂閱。<br>
            回<a href="/">首頁</a>可以訂閱餐廳的空位通知。
          </div>`
        return
      }

      result.innerHTML = `<div class="list">${subs.map(s => `
        <div class="row" id="sub-${esc(s.token)}">
          <div class="row-main">
            <div class="row-name">${esc(s.restaurant_name)}</div>
            <div class="row-detail">${s.people} 人，訂閱於 ${formatDate(s.created_at)}</div>
          </div>
          <div class="row-side">
            <button class="btn btn-danger" onclick="cancelSub('${esc(s.token)}', '${esc(s.restaurant_name)}')">取消訂閱</button>
            <a href="${esc(s.restaurant_url)}" target="_blank" rel="noopener">查看餐廳</a>
          </div>
        </div>`).join('')}</div>`

    } catch {
      result.innerHTML = '<div class="state">讀不到訂閱資料。重新整理頁面再試一次。</div>'
    }
  }

  async function cancelSub(token, name) {
    if (!confirm(`取消「${name}」的空位通知？`)) return
    const el = document.getElementById(`sub-${token}`)
    if (!el) return

    el.querySelector('button').disabled = true

    try {
      await fetch(`/unsubscribe/${token}`)
    } catch {}

    el.classList.add('leaving')
    setTimeout(() => {
      el.remove()
      const list = document.querySelector('#result .list')
      if (list && !list.children.length) {
        document.getElementById('result').innerHTML =
          '<div class="state">已取消所有訂閱，不會再收到通知。</div>'
      }
    }, 220)
  }

  // 如果 URL 帶 email，自動查詢
  const pre = new URLSearchParams(location.search).get('email')
  if (pre) { document.getElementById('email-input').value = pre; loadSubs() }
</script>
</body>
</html>
