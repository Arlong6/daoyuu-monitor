<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韓國餐廳｜訂位雷達</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="site">
  <div class="site-inner">
    <a class="wordmark" href="/">訂位雷達</a>
    <nav class="site-nav" aria-label="頁面">
      <a href="/">台灣餐廳</a>
      <a href="/manage">管理訂閱</a>
    </nav>
  </div>
</header>

<main>
  <section class="lede" aria-labelledby="h1">
    <h1 id="h1">首爾的黑白大廚與米其林餐廳</h1>
    <p>每小時透過 Catch Table 掃描一次，列出接下來開放訂位的日期。</p>
    <p class="now" id="now" aria-live="polite">正在讀取空位狀態</p>
  </section>

  <div id="cards" class="list" style="margin-top:28px" aria-busy="true">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
  <p class="list-foot" id="last-updated"></p>
</main>

<footer class="site">訂位雷達，韓國餐廳資料來自 Catch Table，每小時掃描一次。</footer>

<script>
  function formatTime(iso) {
    if (!iso) return ''
    const d = new Date(iso)
    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
  }

  function sourceLabel(url) {
    if (url.includes('catchtable')) return 'Catch Table'
    if (url.includes('inline.app')) return 'inline'
    if (url.includes('google.com')) return 'Google 訂位'
    return ''
  }

  function buildCard(r, litIndex) {
    const has = r.has_availability
    const src = sourceLabel(r.url)
    const shown = r.dates.slice(0, 6)
    const extra = r.dates.length - shown.length

    const chips = shown.map(d => `<span class="date">${esc(d)}</span>`).join('')
    const more = extra > 0 ? `<span class="more">還有 ${extra} 天</span>` : ''

    return `
      <div class="row ${has ? 'lit' : ''}" style="--i:${litIndex}">
        <div class="row-main">
          <div class="row-name">${esc(r.name)}${src ? `<small>${esc(src)}</small>` : ''}</div>
          <div class="row-detail">${has ? `${r.dates.length} 天可以訂` : '目前沒有空位'}</div>
        </div>
        <div class="row-side">
          <span class="pill ${has ? 'lit' : ''}">${has ? '有位' : '無空位'}</span>
          <a href="${esc(r.url)}" target="_blank" rel="noopener">前往訂位</a>
        </div>
        ${has ? `<div class="dates">${chips}${more}</div>` : ''}
      </div>`
  }

  async function load() {
    const container = document.getElementById('cards')
    try {
      const res = await fetch('/api/inline-status')
      const data = await res.json()

      const sorted = [...data.restaurants].sort((a, b) => b.has_availability - a.has_availability)
      const avail = sorted.filter(r => r.has_availability).length
      const when = data.last_checked ? `<span class="when">上次掃描 ${formatTime(data.last_checked)}</span>` : ''
      document.getElementById('now').innerHTML = avail
        ? `現在有 <strong>${avail} 家</strong>可以訂。${when}`
        : `監控中的 ${sorted.length} 家目前都沒有空位。${when}`

      let lit = 0
      container.innerHTML = sorted.length
        ? sorted.map(r => buildCard(r, r.has_availability ? lit++ : 0)).join('')
        : '<div class="empty">還沒有掃描資料。第一次掃描完成後會出現在這裡。</div>'
      container.setAttribute('aria-busy', 'false')

      if (data.last_checked)
        document.getElementById('last-updated').textContent = `資料更新於 ${formatTime(data.last_checked)}`
    } catch {
      container.innerHTML = '<div class="empty">讀不到空位狀態。重新整理頁面再試一次。</div>'
      container.setAttribute('aria-busy', 'false')
      document.getElementById('now').textContent = '讀不到空位狀態'
    }
  }

  load()
  setInterval(load, 5 * 60 * 1000)
</script>
</body>
</html>
